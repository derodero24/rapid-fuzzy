[package]
name = "rapid-fuzzy"
version = "2.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
rapid-fuzzy-core = { path = "../core-lib" }
napi = { workspace = true }
napi-derive = { workspace = true }
nucleo-matcher = { workspace = true }

[dev-dependencies]
# Test binaries are plain executables rather than Node.js addons, so nothing
# provides the N-API symbols at link time. Resolving them at run time lets
# tests that touch `napi::Error` link; the tests never call into Node.js.
napi = { workspace = true, features = ["dyn-symbols"] }
proptest = "1"
strsim = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
