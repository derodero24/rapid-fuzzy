[package]
name = "rapid-fuzzy-core"
version = "1.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published to crates.io: the crates ship only inside the npm packages.
publish = false
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
nucleo-matcher = { workspace = true }
rapidfuzz = { workspace = true }

# WebAssembly builds search on the calling thread only.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
# Reference implementation for the Sorensen-Dice differential test.
strsim = { workspace = true }
