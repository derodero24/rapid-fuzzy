name: Playground

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

# Nothing by default: the build job only reads the repository, and only the
# deploy job, which runs no repository code, can deploy to GitHub Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Playground
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: build-wasm32-wasip1-threads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: pnpm run build:wasm

      # The playground is a separate npm project, not a pnpm workspace member:
      # install exactly what its committed package-lock.json pins, without
      # lifecycle scripts. Its vite.config.js then resolves rapid-fuzzy to the
      # WASI build made above.
      - name: Build playground
        working-directory: playground
        run: npm ci --ignore-scripts && npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: playground/dist

  deploy:
    name: Deploy Playground
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # configure-pages and deploy-pages publish the site
      id-token: write # deploy-pages authenticates the deployment with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
