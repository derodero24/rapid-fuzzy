name: Release

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default: every job requests only the token scopes it needs.
permissions: {}

jobs:
  # ──── On develop push: manage version PR and create release PR ────
  version:
    name: Version
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action pushes the version branch
      pull-requests: write # changesets/action and `gh pr` open/update the PRs
    env:
      LEFTHOOK: "0"
    steps:
      # This job is the only one that needs git credentials: changesets/action
      # commits the version bump on a branch it manages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create version PR or detect release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"

      - name: Create or update release PR
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Skip if already published
          if npm view "rapid-fuzzy@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already published, skipping release PR"
            exit 0
          fi

          EXISTING=$(gh pr list --base main --head develop --json number --jq '.[0].number')
          # shellcheck disable=SC2016 # the backticks are a literal Markdown fence
          BODY=$(printf '## Release v%s\n\nMerging this PR will:\n1. Build native binaries for all 9 platforms\n2. Publish to npm with provenance\n\n### Changelog\n\n```\n%s\n```' "$VERSION" "$(head -50 CHANGELOG.md)")

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore(release): release v${VERSION}" --body "$BODY"
            echo "Updated existing release PR #${EXISTING}"
          else
            gh pr create --base main --head develop \
              --title "chore(release): release v${VERSION}" \
              --body "$BODY"
            echo "Created release PR for v${VERSION}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──── On main push: check if publish is needed ────
  check:
    name: Check Version
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Check if version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "rapid-fuzzy@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already published, skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} not yet published, proceeding"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  # ──── Build native binaries for all platforms ────
  build:
    name: Build - ${{ matrix.settings.target }}
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-zig: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: wasm32-wasip1-threads
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.settings.target }}

      - run: pnpm install --frozen-lockfile

      # Pinned and checksum-verified: the zig toolchain links the shipped musl
      # binaries. Renovate bumps the version and hashes in the requirements file.
      - name: Install zig
        if: ${{ matrix.settings.use-zig }}
        run: pip3 install --require-hashes -r .github/zig-requirements.txt

      - name: Install cargo-zigbuild
        if: ${{ matrix.settings.use-zig }}
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build
        run: >-
          pnpm build
          --target ${{ matrix.settings.target }}
          ${{ matrix.settings.use-cross && '--use-napi-cross' || '' }}
          ${{ matrix.settings.use-zig && '--cross-compile' || '' }}

      - name: Install binaryen
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: bash scripts/install-binaryen.sh

      - name: Optimize WASM with wasm-opt
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: pnpm run optimize:wasm

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            rapid-fuzzy.*.node
            rapid-fuzzy.*.wasm
            rapid-fuzzy.wasi*.cjs
            rapid-fuzzy.wasi*.cts
            rapid-fuzzy.wasi*.js
            wasi-worker*.mjs
          retention-days: 7
          if-no-files-found: error

  # ──── Load every release binary on its own platform before publishing ────
  # A binary that cannot be loaded where it will be installed (wrong libc, a
  # missing DLL, an unsupported instruction, a missing N-API symbol) must stop
  # the release here rather than reach npm. Each target runs on a runner with
  # the matching OS, architecture and libc (Alpine containers for musl).
  smoke-test:
    name: Smoke test - ${{ matrix.settings.target }}
    needs: [check, build]
    if: needs.check.outputs.should_publish == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            binding: rapid-fuzzy.darwin-arm64.node
          - host: macos-15-intel
            target: x86_64-apple-darwin
            binding: rapid-fuzzy.darwin-x64.node
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binding: rapid-fuzzy.linux-x64-gnu.node
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binding: rapid-fuzzy.linux-x64-musl.node
            alpine: true
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binding: rapid-fuzzy.linux-arm64-gnu.node
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binding: rapid-fuzzy.linux-arm64-musl.node
            alpine: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            binding: rapid-fuzzy.win32-x64-msvc.node
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            binding: rapid-fuzzy.win32-arm64-msvc.node
          - host: ubuntu-latest
            target: wasm32-wasip1-threads
            binding: rapid-fuzzy.wasi.cjs
            wasi: true
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .

      # The WASI loader needs @napi-rs/wasm-runtime and emnapi from node_modules.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: ${{ matrix.settings.wasi }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ !matrix.settings.alpine }}
        with:
          node-version-file: .nvmrc
          cache: ${{ matrix.settings.wasi && 'pnpm' || '' }}
      - if: ${{ matrix.settings.wasi }}
        run: pnpm install --frozen-lockfile

      - name: Load the binding
        if: ${{ !matrix.settings.alpine }}
        run: node .github/scripts/smoke-test.cjs ${{ matrix.settings.binding }}
        env:
          # Require the WASI binding; never fall back to a native one.
          NAPI_RS_FORCE_WASI: ${{ matrix.settings.wasi && 'error' || '' }}

      - name: Load the binding (Alpine, musl)
        if: ${{ matrix.settings.alpine }}
        uses: docker://node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
        with:
          entrypoint: node
          args: .github/scripts/smoke-test.cjs ${{ matrix.settings.binding }}

  # ──── Build the wasm-bindgen browser binary shipped in the root package ────
  build-wasm-bindgen:
    name: Build - wasm-bindgen
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: build-wasm-bindgen
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-pack@0.13.1
      - name: Install binaryen
        run: bash scripts/install-binaryen.sh
      - name: Build wasm-bindgen
        run: pnpm run build:wasm-bindgen
      - name: Verify generated wasm-bindgen glue is up to date
        run: git diff --exit-code rapid-fuzzy-wasm-bindgen.mjs rapid-fuzzy-wasm-bindgen.d.mts browser.mjs browser.d.mts browser-api.mjs workerd.mjs highlight.browser.mjs objects.browser.mjs objects.browser.d.mts
      - name: Upload wasm-bindgen artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bindings-wasm-bindgen
          path: rapid-fuzzy-wasm-bindgen_bg.wasm
          retention-days: 7
          if-no-files-found: error

  # ──── Publish to npm after all builds and smoke tests succeed ────
  publish:
    name: Publish
    needs: [check, build, smoke-test, build-wasm-bindgen]
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          # No dependency cache in the job that holds the publish credentials:
          # whatever a cache restores was written by some other run, and only
          # this job's own install may feed the publish steps (npm's trusted
          # publishing guide: never use caching in release builds).
          registry-url: https://registry.npmjs.org/

      # npm trusted publishing (OIDC) needs npm >= 11.5.1 on Node >= 22.14.0.
      # Pin the npm on PATH, which both publish steps below use (`napi
      # prepublish` shells out to `npm publish`), instead of whichever npm the
      # runner's Node bundles. Renovate bumps the version.
      - name: Install npm
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          echo "node $(node --version), npm $(npm --version) at $(command -v npm)"
        env:
          NPM_VERSION: 11.21.0

      - run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Copy WASM wrapper files to workspace root
        run: |
          WASM_DIR="artifacts/bindings-wasm32-wasip1-threads"
          if [ -d "$WASM_DIR" ]; then
            cp "$WASM_DIR"/*.cjs "$WASM_DIR"/*.cts "$WASM_DIR"/*.js "$WASM_DIR"/*.mjs . 2>/dev/null || true
            echo "Copied WASM wrapper files from $WASM_DIR"
            ls -la rapid-fuzzy.wasi* wasi-worker* 2>/dev/null
          fi

      - name: Copy wasm-bindgen binary to workspace root
        run: cp artifacts/bindings-wasm-bindgen/rapid-fuzzy-wasm-bindgen_bg.wasm .

      - name: Move artifacts to platform packages
        run: pnpm napi artifacts --output-dir artifacts

      # `napi artifacts` rewrites the root loader files from its templates,
      # which drops the appended JS utilities, and writes a WASI browser.js
      # loader. The committed files are the source of truth (CI verifies they
      # match the build output), so restore them before publishing; the
      # package's browser entry is the committed browser.mjs.
      - name: Restore committed binding files
        run: |
          git checkout -- index.js index.d.ts
          rm -f browser.js
          git diff --exit-code browser.mjs browser.d.mts browser-api.mjs workerd.mjs highlight.browser.mjs objects.browser.mjs objects.browser.d.mts

      # The binaries statically link third-party code, so every package ships
      # the notices next to its LICENSE (committed in each npm/* directory).
      - name: Add third-party notices to the platform packages
        run: |
          for dir in npm/*/; do
            cp THIRD_PARTY_NOTICES "$dir"
          done

      - name: List packages
        run: |
          echo "=== Platform packages ==="
          for dir in npm/*/; do
            echo "$dir"
            ls -la "$dir" 2>/dev/null
            echo ""
          done

      # Every entry in package.json "files" must exist, otherwise npm silently
      # publishes a tarball without it (this is how the browser .wasm went
      # missing from every release up to 2.1.0).
      - name: Verify package contents
        run: |
          missing=0
          for manifest in package.json npm/*/package.json; do
            dir=$(dirname "$manifest")
            for f in $(node -p "require('./${manifest}').files.join(' ')"); do
              if [ ! -f "${dir}/${f}" ]; then
                echo "::error::missing file listed in ${manifest} files: ${f}"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ]
          npm pack --dry-run

      # The platform packages go first, then the root package that depends on
      # them. `napi prepublish` also adds the optionalDependencies to the root
      # package.json. GitHub release creation is left to the github-release
      # job, which only runs once everything is on npm.
      #
      # Authentication: for each package, `npm publish` first tries npm trusted
      # publishing (an OIDC token exchange, using `id-token: write`) and falls
      # back to NODE_AUTH_TOKEN (the long-lived NPM_TOKEN) when the exchange
      # fails, e.g. because the package has no trusted publisher for this
      # workflow yet. npm logs that failure only at verbose level, so the
      # fallback stays until a release has been confirmed to publish every
      # package through OIDC. CONTRIBUTING.md ("Releasing") lists the cut-over
      # steps, which end with removing NODE_AUTH_TOKEN from both steps below.
      - name: Publish platform packages
        run: |
          npm config set provenance true
          pnpm exec napi prepublish -t npm --no-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Without these the root package installs no native binary at all. The
      # WASI package is deliberately not an optionalDependency (napi-rs only
      # declares it when it is the sole target); users opt into it.
      - name: Verify optionalDependencies
        run: |
          # shellcheck disable=SC2016 # ${...} is a JavaScript template literal
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const deps = pkg.optionalDependencies ?? {};
            const missing = fs
              .readdirSync("npm")
              .map((dir) => require(`./npm/${dir}/package.json`).name)
              .filter((name) => !name.endsWith("-wasm32-wasi"))
              .filter((name) => deps[name] !== pkg.version);
            if (missing.length > 0) {
              console.error(`optionalDependencies missing or not at ${pkg.version}:`, missing, deps);
              process.exit(1);
            }
          '

      # --ignore-scripts: prepublishOnly would run `napi prepublish` again.
      - name: Publish rapid-fuzzy
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──── Tag the released commit and create the GitHub release ────
  # Runs only after every package is on npm, so a failed publish never leaves
  # a tag or release behind. The tag points at the commit that was built
  # (GITHUB_SHA), not at the default branch.
  github-release:
    name: GitHub Release
    needs: [check, publish]
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release, upload the binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bindings-*
          path: artifacts

      - name: Create tag and release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          NOTES=$(node scripts/extract-changelog.js "$VERSION")

          # Same assets napi-rs used to attach: one binary per target.
          shopt -s nullglob
          assets=(artifacts/bindings-*/rapid-fuzzy.*.node artifacts/bindings-wasm32-wasip1-threads/rapid-fuzzy.wasm32-wasi.wasm)
          expected=$(node -p "require('./package.json').napi.targets.length")
          if [ "${#assets[@]}" -ne "$expected" ]; then
            echo "::error::expected ${expected} release binaries, found ${#assets[@]}: ${assets[*]}"
            exit 1
          fi

          # Re-runs update the existing release instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
