name: Renovate

on:
  schedule:
    - cron: '0 19 * * *' # Daily 19:00 UTC (4:00 JST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Global (self-hosted) allow-list for renovate.json postUpgradeTasks;
          # a repository config cannot grant this itself. Only the binaryen
          # checksum refresh is allowed.
          RENOVATE_ALLOWED_COMMANDS: '["^node \\.github/scripts/update-binaryen-sha256\\.cjs$"]'
          LOG_LEVEL: debug
