name: CI

on:
  push:
    branches: [develop]
    # A deny-list rather than an allow-list: every file that ships in the npm
    # package or feeds a build or test (root *.js/*.mjs/*.d.ts loaders, npm/,
    # scripts/, e2e/, .cargo/, .nvmrc, ...) must trigger CI, including files
    # added later. Only paths that cannot affect any job are skipped. Keep
    # this list in sync with the pull_request one below.
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/assets/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
  pull_request:
    branches: [develop]
    # "labeled" lets the ci-full label re-run the plan job on an open PR.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/assets/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'

permissions:
  contents: read
  pull-requests: read # the plan job reads the PR's changed files and labels

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A label event whose jobs are all skipped must not cancel a run in progress.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  # Decide how much of the build matrix a run needs. Pushes to develop always
  # build every target. Pull requests only build the targets the test jobs
  # consume unless they touch the Rust sources, the Cargo manifests or
  # config, or this workflow, which keeps dependency-only PRs cheap.
  plan:
    name: Plan
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          full='[
            {"host":"macos-latest","target":"x86_64-apple-darwin"},
            {"host":"macos-latest","target":"aarch64-apple-darwin"},
            {"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
            {"host":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},
            {"host":"ubuntu-latest","target":"aarch64-unknown-linux-gnu"},
            {"host":"ubuntu-latest","target":"aarch64-unknown-linux-musl"},
            {"host":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"host":"windows-latest","target":"aarch64-pc-windows-msvc"},
            {"host":"ubuntu-latest","target":"wasm32-wasip1-threads"}
          ]'
          reduced='[
            {"host":"macos-latest","target":"aarch64-apple-darwin"},
            {"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
            {"host":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"host":"ubuntu-latest","target":"wasm32-wasip1-threads"}
          ]'
          matrix="$full"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
            labels=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name')
            # Add the "ci-full" label to a PR to force every target.
            if ! grep -qx 'ci-full' <<< "$labels" \
              && ! grep -Eq '^(crates/|\.cargo/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|deny\.toml$|scripts/|\.github/workflows/ci\.yml$)' <<< "$files"; then
              matrix="$reduced"
            fi
          fi
          echo "Selected build targets:"
          jq -r '.[].target' <<< "$matrix"
          echo "build-matrix=$(jq -c . <<< "$matrix")" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Verify THIRD_PARTY_NOTICES is up to date
        run: |
          cargo fetch --locked
          node scripts/third-party-notices.js --check
      - name: Verify every platform package carries the root LICENSE
        run: |
          for dir in npm/*/; do
            cmp LICENSE "${dir}LICENSE"
          done
      - run: pnpm run build
      - name: Verify generated binding files are up to date
        run: git diff --exit-code index.js index.d.ts browser.js
      - run: pnpm run typecheck
      - run: pnpm run publint

  workflow-lint:
    name: Workflow Lint
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The image bundles shellcheck, so `run:` scripts are checked as well.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  audit:
    name: Dependency Audit
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The published package has no runtime dependencies, so `--prod` could
      # never fail. Audit everything that runs in CI and on contributors'
      # machines instead; pnpm-workspace.yaml overrides patch transitive ones.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  rust-lint:
    name: Rust Lint
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      # Lint levels live in [workspace.lints] (root Cargo.toml); -D warnings
      # turns every warning, rustc's included, into a failure.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: Rust Test
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  msrv:
    name: Rust MSRV
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Check with exactly the toolchain declared as `rust-version` in the root
      # Cargo.toml. RUSTUP_TOOLCHAIN overrides rust-toolchain.toml (which pins
      # stable) for every later step, the cache key included.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error::rust-version not found in Cargo.toml"
            exit 1
          fi
          echo "MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: msrv
      - name: Check the workspace with the MSRV toolchain
        run: |
          rustc --version
          cargo check --workspace --all-targets --locked

  build:
    name: Build - ${{ matrix.settings.target }}
    needs: plan
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.plan.outputs.build-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: build-${{ matrix.settings.target }}
      - run: pnpm install --frozen-lockfile

      # Linux cross-compilation setup
      - name: Install cross-compilation tools (aarch64-gnu)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install cross-compilation tools (x86_64-musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (aarch64-musl)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build native
        if: matrix.settings.target != 'wasm32-wasip1-threads'
        run: pnpm run build --target ${{ matrix.settings.target }}

      - name: Build WASM
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: pnpm run build --target wasm32-wasip1-threads

      - name: Install binaryen
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: bash scripts/install-binaryen.sh

      - name: Optimize WASM with wasm-opt
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: pnpm run optimize:wasm

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.node
            index.js
            index.d.ts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload WASM artifact
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-wasm32
          path: |
            *.wasm
            *.wasi.cjs
            *.wasi-browser.js
            wasi-worker.mjs
            wasi-worker-browser.mjs
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test - Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported Node line runs on Linux; macOS and Windows only need
      # the current LTS since they exist to exercise the native binary loader.
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            artifact: bindings-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            node: 24
            artifact: bindings-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            node: 26
            artifact: bindings-x86_64-unknown-linux-gnu
          - os: macos-latest
            node: 24
            artifact: bindings-aarch64-apple-darwin
          - os: windows-latest
            node: 24
            artifact: bindings-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: .
      # Also exercise the WASI binding on Linux: __test__/wasm.spec.ts skips
      # silently when the binary is absent, so require it here.
      - name: Download WASI artifact
        if: runner.os == 'Linux'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm32
          path: .
      - run: pnpm test
        env:
          RAPID_FUZZY_REQUIRE_WASM: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: ESM import smoke test
        run: node __test__/esm-import.mjs

  coverage:
    name: Coverage
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Rust coverage
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage
        run: cargo llvm-cov --lcov --output-path rust-lcov.info

      # JS coverage
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download x86_64 linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: JS coverage
        run: pnpm test -- --coverage

      # Upload to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: rust-lcov.info,coverage/lcov.info
          flags: rust,javascript
          fail_ci_if_error: false

  build-wasm-bindgen:
    name: Build - wasm-bindgen
    # Label events only matter for ci-full; other labels must not rerun CI.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci-full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: build-wasm-bindgen
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-pack@0.13.1
      - name: Install binaryen
        run: bash scripts/install-binaryen.sh
      - name: Build wasm-bindgen
        run: pnpm run build:wasm-bindgen
      - name: Upload wasm-bindgen artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-wasm-bindgen
          path: rapid-fuzzy-wasm-bindgen_bg.wasm
          retention-days: 7

  test-browser:
    name: Browser WASM Test
    needs: [build-wasm-bindgen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm-bindgen
          path: .
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm run test:browser

  test-bun:
    name: Bun WASM Test
    needs: [build-wasm-bindgen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile
      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm-bindgen
          path: .
      - name: Run Bun WASM tests
        run: pnpm run test:bun

  test-deno:
    name: Deno WASM Test
    needs: [build-wasm-bindgen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm-bindgen
          path: .
      - name: Run Deno WASM tests
        run: pnpm run test:deno
