name: CodeQL

on:
  push:
    branches: [develop]
    # `*.js` does not match `.mjs` or `.cjs`: list every JavaScript and
    # TypeScript extension. The package ships .mjs entry points (index.mjs,
    # browser.mjs, workerd.mjs, the wasm-bindgen glue) with .d.mts
    # declarations, and the workflow scripts in .github/scripts are .cjs.
    paths:
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.json'
      - '**/*.rs'
      - 'pnpm-lock.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6 AM UTC

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'rust']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: matrix.language == 'javascript-typescript'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.language == 'javascript-typescript'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: matrix.language == 'javascript-typescript'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
