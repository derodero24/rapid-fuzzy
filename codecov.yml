coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: 70%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flags:
  rust:
    paths:
      - crates/
    carryforward: true
  javascript:
    # The JS sources are the loader/wrapper modules at the repository root
    # (index.js, objects.js, highlight.js, browser.js, *.mjs, wasm-bindgen glue).
    paths:
      - '*.js'
      - '*.mjs'
      - '*.cjs'
    carryforward: true
