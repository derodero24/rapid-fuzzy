# Link the MSVC C runtime statically so the Windows addons do not depend on
# VCRUNTIME140.dll / the Visual C++ Redistributable being installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
