<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rapid-fuzzy CDN example</title>
</head>
<body>
  <h1>rapid-fuzzy CDN example</h1>
  <label>
    Search: <input id="query" type="search" placeholder="e.g. typscript" />
  </label>
  <ul id="results"></ul>
  <p id="one-off"></p>

  <script type="module">
    // Import the browser build straight from jsDelivr: no npm install or bundler.
    // browser.mjs is plain ES modules; it loads rapid-fuzzy-wasm-bindgen_bg.wasm
    // from the same directory before the import resolves. Pin an exact version
    // (e.g. rapid-fuzzy@2.2.0) in production.
    import { FuzzyIndex, highlight, search } from 'https://cdn.jsdelivr.net/npm/rapid-fuzzy@2/browser.mjs';

    const items = ['TypeScript', 'JavaScript', 'Python', 'Rust', 'Go', 'TypeSpec'];
    const index = new FuzzyIndex(items);

    const input = document.getElementById('query');
    const list = document.getElementById('results');

    function render(query) {
      const matches = query ? index.search(query) : [];
      // Build DOM nodes instead of HTML strings, so items are never parsed as HTML.
      list.replaceChildren(
        ...matches.map((r) => {
          const li = document.createElement('li');
          li.textContent = `${r.item} (${r.score.toFixed(2)})`;
          return li;
        }),
      );
    }

    input.addEventListener('input', (e) => render(e.currentTarget.value));

    // Initial render with a sample query to demonstrate the library
    input.value = 'typscript';
    render('typscript');

    // Standalone search (no index needed for one-off queries), with the matched
    // characters marked by highlight()
    const [best] = search('javas', items, { includePositions: true });
    document.getElementById('one-off').textContent = best
      ? `search("javas") → ${highlight(best.item, best.positions, '[', ']')}`
      : 'search("javas") → no match';

    // Release Rust-side memory when the page is unloaded
    window.addEventListener('beforeunload', () => index.destroy());
  </script>
</body>
</html>
