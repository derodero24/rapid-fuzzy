# pnpm settings live here (pnpm 11+ no longer reads the "pnpm" field in package.json).

# Only lefthook needs to run its install script (it downloads the git hook binary).
allowBuilds:
  lefthook: true

# Security floors for transitive dependencies (all dev-only). Keep each one
# within the major its dependents ask for: an open-ended '>=x' floor resolves
# to the newest major, which is how ajv (fast-uri ^3) ended up on a vulnerable
# fast-uri 4 and cosmiconfig (js-yaml ^4) on js-yaml 5. Renovate therefore
# never proposes a major bump of these (see renovate.json). CI runs
# `pnpm audit --audit-level=high` over all dependencies.
overrides:
  axios: ^1.20.0
  fast-uri: ^3.1.2
  form-data: ^4.0.6
  js-yaml@4: ^4.2.0
  js-yaml@5: ^5.4.1

# @codspeed/vitest-plugin has not declared vite 8 support yet.
peerDependencyRules:
  allowedVersions:
    '@codspeed/vitest-plugin>vite': '8'
