commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --no-errors-on-unmatched
    rustfmt:
      run: $HOME/.cargo/bin/cargo fmt --all -- --check
      glob: "*.rs"

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm run check
    typecheck:
      run: pnpm run typecheck
    test:
      run: pnpm test
    clippy:
      run: $HOME/.cargo/bin/cargo clippy --workspace --all-targets -- -D warnings
    cargo-test:
      run: $HOME/.cargo/bin/cargo test --workspace
    cargo-deny:
      run: PATH="$HOME/.cargo/bin:$PATH" $HOME/.cargo/bin/cargo-deny check
